<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#EFCF6B"/>
      <stop offset="60%" stop-color="#E89C3B" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#1F1611" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1F1611"/>
  <!-- 聚光灯锥 -->
  <ellipse cx="400" cy="300" rx="380" ry="340" fill="url(#spotlight)"/>
  <!-- 灯光线条 -->
  <g stroke="#EFCF6B" stroke-width="2" opacity=".4">
    <line x1="200" y1="80" x2="380" y2="280"/>
    <line x1="600" y1="80" x2="420" y2="280"/>
    <line x1="120" y1="220" x2="360" y2="300"/>
    <line x1="680" y1="220" x2="440" y2="300"/>
    <line x1="400" y1="20" x2="400" y2="260"/>
  </g>
  <!-- 中心人物剪影 -->
  <g transform="translate(400 320)">
    <ellipse cx="0" cy="0" rx="34" ry="42" fill="#1F1611"/>
    <path d="M-70 100 q70 -50 140 0 l0 80 l-140 0 z" fill="#1F1611"/>
    <!-- 心形气泡 -->
    <g transform="translate(80 -80)">
      <circle r="22" fill="#C24A35"/>
      <text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#FBF8F1">♪</text>
    </g>
    <!-- 想法气泡 -->
    <g transform="translate(-90 -60)">
      <circle r="18" fill="#FBF8F1" opacity=".9"/>
      <text y="5" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#1F1611">?</text>
    </g>
  </g>
  <text x="400" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="28" letter-spacing="4" fill="#FBF8F1">聚光灯效应 · 口水歌 MV</text>
  <text x="400" y="544" text-anchor="middle" font-family="Menlo, monospace" font-size="13" letter-spacing="6" fill="#EFCF6B">SPOTLIGHT EFFECT · SONG-MV</text>
  <text x="60" y="570" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#E89C3B">心理实践技能大赛 · 校三等奖</text>
  <text x="740" y="570" text-anchor="end" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#E89C3B">脚本 · 编曲 · 出演</text>
</svg>