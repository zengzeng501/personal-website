<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".5" stop-color="#c9d1d8"/>
      <stop offset="1" stop-color="#4a525c"/>
    </linearGradient>
    <radialGradient id="gem1" cx=".35" cy=".25">
      <stop offset="0" stop-color="#3a1828"/>
      <stop offset=".55" stop-color="#7a1a38"/>
      <stop offset="1" stop-color="#15060e"/>
    </radialGradient>
    <radialGradient id="gem2" cx=".4" cy=".3">
      <stop offset="0" stop-color="#3a0e1a"/>
      <stop offset=".7" stop-color="#1a0610"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>

  <!-- 上锚：银色涡卷 -->
  <g transform="translate(110 16)">
    <path d="M-32 0 C -28 -12, -12 -12, -12 -2 S -28 6, -28 16" stroke="url(#sg)" stroke-width="2.4" fill="none"/>
    <path d="M 32 0 C  28 -12,  12 -12,  12 -2 S  28 6,  28 16" stroke="url(#sg)" stroke-width="2.4" fill="none"/>
    <circle r="7" fill="#1a1a1a" stroke="url(#sg)" stroke-width="1.2"/>
    <circle r="3.5" fill="url(#gem1)"/>
  </g>

  <!-- 三条银链 (锥形连接多颗) -->
  <g stroke="url(#sg)" stroke-width=".9" fill="none">
    <path d="M82 22 Q 96 60, 110 96"/>
    <path d="M138 22 Q 124 60, 110 96"/>
    <path d="M82 22 Q 70 50, 82 80 Q 96 100, 110 96"/>
    <path d="M138 22 Q 150 50, 138 80 Q 124 100, 110 96"/>
  </g>

  <!-- 链条上的小球 (节点) -->
  <g fill="url(#sg)" stroke="#4a525c" stroke-width=".4">
    <circle cx="82"  cy="22" r="3.4"/>
    <circle cx="138" cy="22" r="3.4"/>
    <circle cx="92"  cy="50" r="3"/>
    <circle cx="128" cy="50" r="3"/>
    <circle cx="98"  cy="78" r="3.6"/>
    <circle cx="122" cy="78" r="3.6"/>
  </g>

  <!-- 中央垂下大宝钻 (外圈暗色 + 内核红) -->
  <g transform="translate(110 96)">
    <circle r="14" fill="#0e0e0e" stroke="url(#sg)" stroke-width="1.6"/>
    <circle r="11" fill="url(#gem1)"/>
    <circle r="6"  fill="url(#gem2)"/>
    <circle r="2.4" fill="#ff5070" opacity=".9"/>
    <ellipse cx="-3" cy="-3" rx="3" ry="2" fill="#fff" opacity=".45"/>
  </g>

  <!-- 两侧下垂的小宝钻 -->
  <g transform="translate(82 80)">
    <circle r="8" fill="#0e0e0e" stroke="url(#sg)" stroke-width="1.2"/>
    <circle r="6" fill="url(#gem1)"/>
    <circle r="1.6" fill="#ff5070"/>
  </g>
  <g transform="translate(138 80)">
    <circle r="8" fill="#0e0e0e" stroke="url(#sg)" stroke-width="1.2"/>
    <circle r="6" fill="url(#gem1)"/>
    <circle r="1.6" fill="#ff5070"/>
  </g>

  <!-- 底部大吊坠 (完整宝钻+尖尖) -->
  <g transform="translate(110 116)">
    <path d="M0 -22 Q 7 -8, 6 0 Q 3 8, 0 14 Q -3 8, -6 0 Q -7 -8, 0 -22 Z" fill="url(#gem1)" stroke="url(#sg)" stroke-width="1.2"/>
    <path d="M0 -22 Q 5 -8, 4 0 Q 2 6, 0 10" fill="none" stroke="#fff" stroke-width=".5" opacity=".5"/>
    <circle cx="-2" cy="-8" r="1.4" fill="#fff" opacity=".6"/>
  </g>
</svg>
