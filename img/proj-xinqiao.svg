<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#F2E9D8"/>
  <!-- PDCA 循环环 -->
  <g transform="translate(400 320)">
    <circle r="180" fill="none" stroke="#22313F" stroke-width="2" opacity=".25"/>
    <circle r="180" fill="none" stroke="#C24A35" stroke-width="6" stroke-dasharray="80 70 80 80" opacity=".9"/>
    <text x="0" y="-200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#22313F" letter-spacing="6">P</text>
    <text x="142" y="-142" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#22313F" letter-spacing="6">D</text>
    <text x="200" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#22313F" letter-spacing="6">C</text>
    <text x="142" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#22313F" letter-spacing="6">A</text>
    <text x="-200" y="0" text-anchor="start" font-family="Menlo, monospace" font-size="10" fill="#5C6672" letter-spacing="2">PDCA · CYCLE</text>
  </g>
  <!-- 心桥图标 -->
  <g transform="translate(80 100)" stroke="#22313F" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0 40 q40 -50 80 0 q40 -50 80 0" stroke="#C24A35"/>
    <circle cx="40" cy="20" r="10" fill="#C24A35" stroke="none"/>
    <circle cx="80" cy="20" r="10" fill="#C24A35" stroke="none"/>
    <circle cx="120" cy="20" r="10" fill="#C24A35" stroke="none"/>
    <text x="0" y="80" font-family="Georgia, serif" font-size="14" fill="#22313F" font-weight="bold" stroke="none" letter-spacing="3">心桥圈 · 品质管理</text>
  </g>
  <!-- 中心数字：可及性指数提升 -->
  <g transform="translate(400 320)">
    <text text-anchor="middle" y="-10" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#22313F">40.94→57.23</text>
    <text text-anchor="middle" y="22" font-family="Menlo, monospace" font-size="11" letter-spacing="4" fill="#C24A35">可及性指数 · ACCESSIBILITY INDEX</text>
    <text text-anchor="middle" y="46" font-family="Menlo, monospace" font-size="10" letter-spacing="3" fill="#5C6672">+39.8%  目标达标率 156%</text>
  </g>
  <text x="60" y="560" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#5C6672">2025 · 宁波大学附属康宁医院</text>
  <text x="740" y="560" text-anchor="end" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#C24A35">8 圈员 · 8 个月</text>
