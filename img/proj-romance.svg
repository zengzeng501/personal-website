<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FBF1E2"/>
  <!-- 餐厅桌面（透视） -->
  <path d="M0 320 L800 320 L800 600 L0 600 Z" fill="#E8C896"/>
  <path d="M0 320 L800 320 L800 360 L0 360 Z" fill="#C9A87E"/>
  <!-- 烛光 -->
  <g transform="translate(400 230)">
    <rect x="-8" y="0" width="16" height="60" fill="#FBF8F1" stroke="#5C6672" stroke-width="1.5"/>
    <ellipse cx="0" cy="-5" rx="3" ry="14" fill="#E89C3B"/>
    <ellipse cx="0" cy="-10" rx="8" ry="18" fill="#EFCF6B" opacity=".7"/>
    <!-- 光晕 -->
    <circle cx="0" cy="-5" r="60" fill="#EFCF6B" opacity=".15"/>
    <circle cx="0" cy="-5" r="120" fill="#EFCF6B" opacity=".08"/>
  </g>
  <!-- 餐盘 -->
  <g transform="translate(220 460)">
    <circle r="80" fill="#FBF8F1" stroke="#5C6672" stroke-width="2"/>
    <circle r="62" fill="none" stroke="#E89C3B" stroke-width="2" stroke-dasharray="3 4"/>
    <text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C6672" letter-spacing="3">PLATE</text>
  </g>
  <g transform="translate(580 480)">
    <ellipse rx="74" ry="22" fill="#FBF8F1" stroke="#5C6672" stroke-width="2"/>
    <ellipse rx="58" ry="14" fill="none" stroke="#C24A35" stroke-width="2"/>
  </g>
  <!-- 分析图表 - 雷达图 -->
  <g transform="translate(400 130)">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#5C6672" stroke-width="1.5" opacity=".4"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#C24A35" opacity=".25" stroke="#C24A35" stroke-width="2"/>
    <circle r="3" fill="#22313F"/>
  </g>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#22313F">浪漫餐厅 · 游戏拆解</text>
  <text x="400" y="106" text-anchor="middle" font-family="Menlo, monospace" font-size="12" letter-spacing="6" fill="#C24A35">ROMANTIC RESTAURANT · GAME ANALYSIS</text>
  <text x="60" y="570" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#5C6672">游戏机制 · 美术 · 叙事 三维分析</text>
  <text x="740" y="570" text-anchor="end" font-family="Menlo, monospace" font-size="11" letter-spacing="3" fill="#5C6672">2025 · 独立分析</text>
</svg>