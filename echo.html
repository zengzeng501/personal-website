<main class="page">
  <div class="page-head">
    <div class="kicker">04 / ECHO BOARD</div>
    <h1>他人回声</h1>
    <p class="sub">别人眼中的我——性格、想法与行动力，由身边的人来说。</p>
  </div>

  <div class="echo-wall">
    <div class="echo-note" style="--r:-2deg"><div class="pin"></div><p>"性格活泼，胆子时而大时而小，尤其特别乐观。"</p><span>— 朋友</span></div>
    <div class="echo-note" style="--r:1.5deg"><div class="pin red"></div><p>"脑子里有很多想法，喜欢为朋友分析烦恼。"</p><span>— 同学</span></div>
    <div class="echo-note" style="--r:-1deg"><div class="pin blue"></div><p>"知道自己想做什么，遇到问题会想办法解决。"</p><span>— 同事</span></div>
  </div>

  <div class="echo-outro">
    <p class="cn">我希望自己一直是一个——<b>有想法，但更愿意把想法做出来的人。</b></p>
    <p class="en">Ideas matter. Execution matters more.</p>
    <a class="back" href="index.html">← 回到洞洞板</a>
  </div>
</main>
